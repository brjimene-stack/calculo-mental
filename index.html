<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retos de Cálculo Mental · IB Mathematics</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#1f2937;display:flex;align-items:center;justify-content:center;padding:24px}
.container{width:min(860px,100%)}
.card{background:#fff;border-radius:18px;padding:36px;box-shadow:0 14px 40px rgba(0,0,0,.10)}
.langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
.langbtn{border:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#374151}
.langbtn.on{background:#1f4e78;color:#fff}
.eyebrow{color:#1f4e78;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
h1{margin:0 0 10px;font-size:clamp(26px,4.2vw,34px);line-height:1.2}
.subtitle{color:#6b7280;margin:0 0 30px;max-width:56ch}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
a.option{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:24px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
a.option:hover,a.option:focus-visible{transform:translateY(-3px);box-shadow:0 12px 26px rgba(31,78,120,.16);border-color:#1f4e78;outline:none}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:56px;padding:0 12px;border-radius:14px;background:#1f4e78;color:#fff;font-size:24px;font-weight:800;margin-bottom:16px;align-self:flex-start}
.badge.alt{background:#0f766e}
.badge sub{font-size:.55em;font-weight:700}
a.option h2{margin:0 0 6px;font-size:20px}
.level{color:#6b7280;font-size:13px;font-weight:700;margin:0 0 14px}
a.option ul{margin:0 0 20px;padding-left:20px;color:#4b5563;font-size:14px;line-height:1.7}
.go{margin-top:auto;align-self:flex-start;background:#1f4e78;color:#fff;border-radius:10px;padding:11px 20px;font-weight:700;font-size:15px}
a.option:hover .go{background:#163a59}
.badge.alt~.go{background:#0f766e}
a.option:hover .badge.alt~.go{background:#0b5750}
.note{margin-top:30px;padding:16px 18px;background:#eef2ff;border-radius:12px;font-size:14px;color:#3730a3;line-height:1.65}
footer{margin-top:22px;text-align:center;color:#9ca3af;font-size:13px}
@media(max-width:700px){.menu{grid-template-columns:1fr}.card{padding:24px}}
</style>
</head>
<body>
<main class="container">
<section class="card">
  <div class="langbar">
    <button class="langbtn on" id="btnEs" type="button">ES</button>
    <button class="langbtn" id="btnEn" type="button">EN</button>
  </div>

  <p class="eyebrow" data-i18n="eyebrow"></p>
  <h1 data-i18n="title"></h1>
  <p class="subtitle" data-i18n="subtitle"></p>

  <div class="menu">
    <a class="option" href="aritmetica.html">
      <span class="badge">×÷</span>
      <h2 data-i18n="c1title"></h2>
      <p class="level" data-i18n="c1level"></p>
      <ul id="c1list"></ul>
      <span class="go" data-i18n="cta"></span>
    </a>

    <a class="option" href="logaritmos.html">
      <span class="badge alt">log<sub>b</sub></span>
      <h2 data-i18n="c2title"></h2>
      <p class="level" data-i18n="c2level"></p>
      <ul id="c2list"></ul>
      <span class="go" data-i18n="cta"></span>
    </a>
  </div>

  <p class="note" data-i18n="note"></p>
  <footer data-i18n="footer"></footer>
</section>
</main>

<script>
const I18N={
 es:{
  eyebrow:"PrepaTec · IB Mathematics",
  title:"Retos de Cálculo Mental",
  subtitle:"Práctica cronometrada de fluidez numérica. Elige un reto, responde contra el reloj y descarga tus resultados en CSV al terminar.",
  c1title:"Operaciones básicas",
  c1level:"preIB Math I &amp; II · repaso IB",
  c1list:["Sumas y restas","Multiplicaciones y divisiones","Modo mixto"],
  c2title:"Logaritmos y precisión",
  c2level:"IB MAI · nivel HL",
  c2list:["Logaritmos exactos (bases enteras, ln, base fraccionaria)","Notación científica → decimal","Redondeo a cifras decimales","Cifras significativas"],
  cta:"Comenzar →",
  note:"<b>Antes de empezar:</b> escribe tu nombre y matrícula tal como aparecen en Canvas. Al terminar, presiona <b>Descargar esta sesión</b> y sube el archivo CSV a la entrega correspondiente. Tus respuestas se procesan en tu propio navegador: no se envían a ningún servidor.",
  footer:"Usa un punto decimal en las respuestas. Ej.: -3 · 0.0046 · 3700"
 },
 en:{
  eyebrow:"PrepaTec · IB Mathematics",
  title:"Mental Maths Challenges",
  subtitle:"Timed practice in number fluency. Pick a challenge, answer against the clock, and download your results as a CSV when you finish.",
  c1title:"Basic operations",
  c1level:"preIB Math I &amp; II · IB review",
  c1list:["Addition and subtraction","Multiplication and division","Mixed mode"],
  c2title:"Logarithms &amp; accuracy",
  c2level:"IB MAI · HL level",
  c2list:["Exact logarithms (integer bases, ln, fractional base)","Standard form → decimal","Rounding to decimal places","Significant figures"],
  cta:"Start →",
  note:"<b>Before you start:</b> type your name and student ID exactly as they appear in Canvas. When you finish, click <b>Download this session</b> and upload the CSV to the matching assignment. Your answers are processed in your own browser — nothing is sent to a server.",
  footer:"Use a decimal point in your answers. e.g. -3 · 0.0046 · 3700"
 }
};
let lang="es";
function applyLang(){
 const t=I18N[lang];
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(t[k]!==undefined)el.innerHTML=t[k]});
 document.getElementById("c1list").innerHTML=t.c1list.map(x=>"<li>"+x+"</li>").join("");
 document.getElementById("c2list").innerHTML=t.c2list.map(x=>"<li>"+x+"</li>").join("");
 document.getElementById("btnEs").classList.toggle("on",lang==="es");
 document.getElementById("btnEn").classList.toggle("on",lang==="en");
 try{localStorage.setItem("mathChallengeLang",lang)}catch(e){}
}
document.getElementById("btnEs").onclick=()=>{lang="es";applyLang()};
document.getElementById("btnEn").onclick=()=>{lang="en";applyLang()};
try{const saved=localStorage.getItem("mathChallengeLang");if(saved==="en"||saved==="es")lang=saved}catch(e){}
applyLang();
</script>
</body>
</html>
